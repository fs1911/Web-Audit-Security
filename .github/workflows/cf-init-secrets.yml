# Erzeugt die Laufzeit-Secrets des Workers zufällig und setzt sie nur, falls sie noch fehlen.
# Niemand sieht die Werte (sie werden im Log maskiert und nur an Cloudflare übergeben).
# ACHTUNG: APP_ENCRYPTION_KEY nie neu setzen, solange verschlüsselte Zugangsdaten existieren.
name: "Cloudflare: Secrets initialisieren"
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  init:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Voraussetzungen prüfen
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::GitHub-Secret CLOUDFLARE_API_TOKEN fehlt"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::GitHub-Secret CLOUDFLARE_ACCOUNT_ID fehlt"; exit 1; }
      - name: Fehlende Secrets erzeugen und setzen
        run: |
          existing=$(npx wrangler secret list --name web-audit-security --format json 2>/dev/null || echo "[]")
          for name in APP_ENCRYPTION_KEY RUNNER_CALLBACK_SECRET RUNNER_SHARED_SECRET; do
            if echo "$existing" | grep -q "\"$name\""; then
              echo "$name ist bereits gesetzt – unverändert."
              continue
            fi
            if [ "$name" = "APP_ENCRYPTION_KEY" ]; then value=$(openssl rand -base64 32); else value=$(openssl rand -hex 32); fi
            echo "::add-mask::$value"
            printf '%s' "$value" | npx wrangler secret put "$name" --name web-audit-security
            echo "$name gesetzt."
          done
